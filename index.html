
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OceanMoon — Intelligence Beyond Horizons</title>
  <meta name="description" content="OceanMoon — Explore the future of AI, technology and global markets.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      color: #f4f5fb;
      background:
        radial-gradient(ellipse at 50% 42%, #172c4c 0%, #0a1426 42%, #050914 100%);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 30px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .logo span { color: #83baff; }
    .tag {
      color: #aab8d0;
      font-size: 12px;
      letter-spacing: 2px;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 24px 100px;
    }
    .moon {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fff 5%, #b9d7ff 55%, #6889c1 100%);
      box-shadow: 0 0 45px #8abaff55, 0 0 110px #568dff30;
      margin-bottom: 42px;
    }
    h1 {
      font-size: clamp(42px, 7vw, 76px);
      letter-spacing: 5px;
      margin: 0 0 20px;
    }
    .subtitle {
      color: #aabbd4;
      font-size: clamp(14px, 2vw, 18px);
      letter-spacing: 3px;
      margin-bottom: 25px;
    }
    .description {
      max-width: 570px;
      color: #8998b2;
      line-height: 1.9;
      font-size: 14px;
    }
    .button {
      margin-top: 38px;
      padding: 14px 32px;
      border: 1px solid #739edb;
      border-radius: 30px;
      color: white;
      text-decoration: none;
      letter-spacing: 1px;
      transition: .25s;
    }
    .button:hover {
      background: #739edb;
      color: #071020;
    }
    footer {
      text-align: center;
      padding: 25px;
      color: #63718b;
      font-size: 11px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">OCEAN<span>MOON</span></div>
    <div class="tag">EXPLORE THE UNKNOWN</div>
  </header>

  <main>
    <div class="moon"></div>
    <h1>OCEANMOON</h1>
    <div class="subtitle">INTELLIGENCE BEYOND HORIZONS</div>
    <p class="description">
      Discover the signals shaping tomorrow.
      Explore artificial intelligence, global technology,
      financial markets and the opportunities of a changing world.
    </p>
    <a class="button" href="mailto:hello@oceanmoon.ai">
      COMING SOON
    </a>
  </main>

  <footer>© 2026 OCEANMOON · A NEW PERSPECTIVE</footer>
</body>
</html>
